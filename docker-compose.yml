services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same-origin path: nginx proxies /api through to the backend, so the
        # page never has to reach localhost:8000 itself. Override only if you
        # are serving the API from a separate host.
        VITE_API_BASE_URL: /api
    container_name: job-pulse-frontend
    ports:
      - "8080:80"
    restart: always
    environment:
      - NODE_ENV=production
    depends_on:
      # Waits for the API to actually answer, not just for the container to
      # exist. The page loads instantly and fires several requests on mount;
      # starting it while the backend was still migrating meant every one of
      # them failed with "Failed to fetch".
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-pulse-backend
    ports:
      - "8000:8000"
    restart: always
    # Loads GOOGLE_API_KEY / OPENAI_API_KEY / ADZUNA_* from the root .env.
    # Without this the AI providers silently fall back to keyword heuristics.
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobpulse:jobpulse_pass@postgres:5432/jobpulse
      # The browser talks to the frontend's own origin and nginx proxies from
      # there, so this only matters if you call the API directly on :8000.
      - CORS_ORIGINS=http://localhost:8080,http://localhost:5173
    healthcheck:
      # /health runs a real SELECT, so this only passes once migrations have
      # finished and the database is genuinely reachable.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: job-pulse-postgres
    # Port intentionally NOT published: the DB is reachable only on the
    # compose network. Uncomment for local psql access if you need it.
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_USER=jobpulse
      - POSTGRES_PASSWORD=jobpulse_pass
      - POSTGRES_DB=jobpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
