server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for high performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ------------------------------------------------------------------
    # API reverse proxy.
    #
    # Without this the browser had to call the backend directly on
    # http://localhost:8000, which meant:
    #   * every request was cross-origin and depended on CORS_ORIGINS being
    #     exactly right, and
    #   * "localhost" resolved to whatever machine the *browser* was on, so
    #     opening the dashboard from any device other than the Docker host
    #     failed with "Failed to fetch" and no way to fix it client-side.
    #
    # Proxying here means the page only ever talks to its own origin.
    # ------------------------------------------------------------------
    # Job Spy fans out to several scraped boards through MCP and can run longer
    # than a normal Jobs search. Scoped here so existing /api/ timeouts stay.
    location /api/prompt-ai/ {
        proxy_pass http://backend:8000/api/prompt-ai/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering off;
    }

    location /api/jobspy/ {
        proxy_pass http://backend:8000/api/jobspy/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A job search fans out to several upstream boards, so it can take
        # appreciably longer than a default 60s proxy timeout allows.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Resume uploads are multipart PDFs.
        client_max_body_size 10m;

        # Streaming responses must not be buffered by nginx.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets. Scoped to /assets/ so it cannot swallow /api.
    location ~* ^/assets/.*\.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
